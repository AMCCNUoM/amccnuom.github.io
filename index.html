<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Andrew Mayes Centre for Cognitive Neuroscience</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="The Andrew Mayes Centre for Cognitive Neuroscience at the University of Manchester — research, training, facilities and public engagement." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #f6f1e6; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  a { color: inherit; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="amccn-data.jsx"></script>
<script type="text/babel" src="amccn-site.jsx"></script>

<script type="text/babel">
const PALETTE = {
  name:   'Monograph',
  paper:  '#f1ead6',  // oatmeal cream, warm but not pink
  paper2: '#e6dcc0',  // meaningfully darker; reads as a distinct surface
  ink:    '#1d2a2e',  // deep blue-black, like oxidised iron-gall ink
  body:   '#2a241c',  // warm near-black for running text
  soft:   '#6b6253',  // warm grey-brown for captions
  rule:   '#b8a980',  // ochre that earns its visibility
  accent: '#6e2a23',  // deep sienna / oxblood — institutional, not fresh
};

  ReactDOM.createRoot(document.getElementById('root')).render(
    <ReadingRoom palette={PALETTE} />
  );
</script>
</body>
</html>
